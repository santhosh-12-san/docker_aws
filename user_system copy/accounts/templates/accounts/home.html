{% extends 'accounts/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-5 text-center shadow">
            {% if user.profile.image %}
                <img src="{{ user.profile.image.url }}" class="rounded-circle mx-auto d-block mb-3" width="150" height="150" style="object-fit: cover; border: 5px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
            {% endif %}
            
            <h2 class="fw-bold">{{ user.profile.full_name }}</h2>
            <p class="text-muted">@{{ user.username }}</p>
            
            <div class="card bg-light p-3 mt-4 text-start">
                <h5>About Me:</h5>
                <p>{{ user.profile.bio }}</p>
            </div>

            <a href="{% url 'logout' %}" class="btn btn-outline-danger mt-4">Logout</a>
        </div>
    </div>
</div>
{% endblock %}
